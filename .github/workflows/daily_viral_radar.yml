name: Daily Global Viral Radar

on:
  schedule:
    # Runs everyday at 02:00 UTC (08:00 AM Bangladesh Standard Time)
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Run Global Viral Radar Scan
        run: |
          python scripts/global_viral_radar.py scan --query "GTA 6" --limit 5

      - name: Commit & Push Daily Report
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add DAILY_VIRAL_REPORT.md reports/
          git commit -m "Auto-generate Daily Global Viral Radar Report [skip ci]" || exit 0
          git push
